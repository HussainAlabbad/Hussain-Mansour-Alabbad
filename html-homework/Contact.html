<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Student Website</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Navigation -->
  <nav>
    <a href="index.html" class="nav-logo">MyPortfolio</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="table.html">Table</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
  </nav>

  <!-- Main Content -->
  <div class="page-wrapper">

    <!-- Page Header (ID) -->
    <div id="page-header">
      <h1>Contact Me</h1>
      <p>Fill in the form below and I'll get back to you</p>
    </div>

    <!-- Contact Form Card -->
    <div class="card">
      <h2 class="section-title">Send a Message</h2>
      <p class="section-subtitle">All fields marked are required</p>

      <form action="#" method="post">
        <div class="form-grid">

  <!-- Name -->
<div class="form-group">
  <label for="name">Full Name</label>
  <input
    type="text"
    id="name"
    name="name"
    placeholder=" Your full name"
    required
  />
</div>

<!-- Email -->
<div class="form-group">
  <label for="email">Email Address</label>
  <input
    type="email"
    id="email"
    name="email"
    placeholder=" your@email.com"
    required
  />
</div>

          <!-- Password -->
          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Create a password"
              required
            />
          </div>

          <!-- Country -->
          <div class="form-group">
            <label for="country">Country</label>
            <select id="country" name="country" required>
              <option value="" disabled selected>Select your country</option>
              <option value="sa">Saudi Arabia</option>
              <option value="ae">United Arab Emirates</option>
              <option value="kw">Kuwait</option>
              <option value="qa">Qatar</option>
              <option value="bh">Bahrain</option>
              <option value="om">Oman</option>
              <option value="jo">Jordan</option>
              <option value="eg">Egypt</option>
              <option value="other">Other</option>
            </select>
          </div>

          <!-- City (Datalist) -->
          <div class="form-group full">
            <label for="city">City</label>
            <input
              type="text"
              id="city"
              name="city"
              list="cities-list"
              placeholder="Start typing your city…"
            />
            <datalist id="cities-list">
              <option value="Riyadh" />
              <option value="Jeddah" />
              <option value="Mecca" />
              <option value="Medina" />
              <option value="Dammam" />
              <option value="Dubai" />
              <option value="Abu Dhabi" />
              <option value="Kuwait City" />
              <option value="Doha" />
              <option value="Muscat" />
              <option value="Amman" />
              <option value="Cairo" />
            </datalist>
          </div>

          <!-- Gender (Radio) -->
          <div class="form-group full">
            <label>Gender</label>
            <div class="radio-group">
              <label>
                <input type="radio" name="gender" value="male" /> Male
              </label>
              <label>
                <input type="radio" name="gender" value="female" /> Female
              </label>
              <label>
               
              </label>
            </div>
          </div>

          <!-- Skills (Checkbox) -->
          <div class="form-group full">
            <label>Skills (select all that apply)</label>
            <div class="checkbox-group">
              <label><input type="checkbox" name="skills" value="html" /> HTML</label>
              <label><input type="checkbox" name="skills" value="css" /> CSS</label>
              <label><input type="checkbox" name="skills" value="js" /> JavaScript</label>
              <label><input type="checkbox" name="skills" value="git" /> Git</label>
              <label><input type="checkbox" name="skills" value="python" /> Python</label>
              <label><input type="checkbox" name="skills" value="C++" />C++</label>
            </div>
          </div>

          <!-- Message (Textarea) -->
          <div class="form-group full">
            <label for="message">Message</label>
            <textarea
              id="message"
              name="message"
              placeholder="Write your message here…"
              required
            ></textarea>
          </div>

          <!-- Buttons -->
          <div class="form-group full">
            <div class="btn-group">
              <button type="submit">Send Message</button>
              <button type="reset">Reset Form</button>
            </div>
          </div>

        </div>
      </form>
    </div>

  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 <span>Hussain Mansour-Alabbad</span> · Foundation Bootcamp Project</p>
  </footer>

</body>
</html>
